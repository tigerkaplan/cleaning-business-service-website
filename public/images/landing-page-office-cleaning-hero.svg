<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clean modern office prepared for professional cleaning</title>
  <desc id="desc">A bright office with desks, chairs, plants and a purple feature wall, used as the BrightShore Cleaning homepage hero image.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F0FF"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3B0764" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="780" rx="44" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="450" rx="44" fill="url(#wall)"/>
  <rect x="0" y="448" width="1200" height="332" fill="#F3F4F6"/>
  <path d="M0 448H1200" stroke="#DDD6FE" stroke-width="2"/>

  <!-- window wall -->
  <g filter="url(#shadow)">
    <rect x="72" y="82" width="260" height="280" rx="14" fill="#EEF2FF" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="360" y="82" width="260" height="280" rx="14" fill="#EEF2FF" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="648" y="82" width="260" height="280" rx="14" fill="#EEF2FF" stroke="#CBD5E1" stroke-width="4"/>
    <path d="M202 84V362M490 84V362M778 84V362" stroke="#CBD5E1" stroke-width="4"/>
    <path d="M76 222H906" stroke="#CBD5E1" stroke-width="4"/>
  </g>

  <!-- purple feature wall -->
  <rect x="948" y="72" width="172" height="388" rx="22" fill="url(#purple)"/>
  <rect x="995" y="142" width="78" height="92" rx="10" fill="#FFFFFF" opacity="0.16"/>
  <path d="M1018 194c16-16 32-16 48 0" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M1032 168l7 14 16 3" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- ceiling lights -->
  <rect x="94" y="40" width="250" height="18" rx="9" fill="#E9D5FF"/>
  <rect x="432" y="40" width="250" height="18" rx="9" fill="#E9D5FF"/>
  <rect x="770" y="40" width="250" height="18" rx="9" fill="#E9D5FF"/>

  <!-- desks -->
  <g filter="url(#shadow)">
    <rect x="120" y="456" width="370" height="42" rx="14" fill="#FFFFFF"/>
    <rect x="148" y="498" width="28" height="142" rx="8" fill="#CBD5E1"/>
    <rect x="430" y="498" width="28" height="142" rx="8" fill="#CBD5E1"/>

    <rect x="542" y="440" width="420" height="46" rx="14" fill="#FFFFFF"/>
    <rect x="572" y="486" width="30" height="150" rx="8" fill="#CBD5E1"/>
    <rect x="900" y="486" width="30" height="150" rx="8" fill="#CBD5E1"/>
  </g>

  <!-- monitors -->
  <g>
    <rect x="190" y="350" width="116" height="76" rx="8" fill="#111827"/>
    <rect x="204" y="363" width="88" height="50" rx="3" fill="#CBD5E1"/>
    <rect x="238" y="426" width="20" height="30" fill="#475569"/>
    <rect x="214" y="454" width="70" height="12" rx="6" fill="#475569"/>

    <rect x="640" y="330" width="140" height="90" rx="8" fill="#111827"/>
    <rect x="657" y="346" width="106" height="58" rx="3" fill="#CBD5E1"/>
    <rect x="698" y="420" width="24" height="34" fill="#475569"/>
    <rect x="670" y="452" width="82" height="12" rx="6" fill="#475569"/>

    <rect x="820" y="350" width="116" height="76" rx="8" fill="#111827"/>
    <rect x="834" y="363" width="88" height="50" rx="3" fill="#CBD5E1"/>
    <rect x="870" y="426" width="20" height="30" fill="#475569"/>
    <rect x="846" y="454" width="70" height="12" rx="6" fill="#475569"/>
  </g>

  <!-- chairs -->
  <g stroke="#111827" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.88">
    <path d="M308 492c-14 26-16 58-6 92"/>
    <path d="M288 494h92c18 0 30 14 28 31l-6 54"/>
    <path d="M342 580v82"/>
    <path d="M300 662h84"/>
    <path d="M712 492c-14 26-16 58-6 92"/>
    <path d="M692 494h92c18 0 30 14 28 31l-6 54"/>
    <path d="M746 580v82"/>
    <path d="M704 662h84"/>
  </g>

  <!-- plants -->
  <g>
    <rect x="1000" y="520" width="56" height="92" rx="14" fill="#E9D5FF"/>
    <path d="M1028 520C997 474 978 430 989 394c34 28 48 66 39 126Z" fill="#22C55E"/>
    <path d="M1028 520c15-58 44-102 86-126 8 48-28 96-86 126Z" fill="#16A34A"/>
    <path d="M1028 520c-20-50-14-94 18-132 28 38 26 84-18 132Z" fill="#4ADE80"/>

    <rect x="82" y="514" width="54" height="88" rx="14" fill="#E9D5FF"/>
    <path d="M109 516C83 482 72 440 88 410c28 20 38 58 21 106Z" fill="#22C55E"/>
    <path d="M108 516c20-48 54-80 96-92-2 44-40 82-96 92Z" fill="#16A34A"/>
  </g>

  <!-- shine/check cleanliness cues -->
  <g stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M103 690l18 18 40-48"/>
    <path d="M1082 662l16 16 38-44"/>
  </g>
  <g fill="#7C3AED" opacity="0.72">
    <path d="M520 164l15 31 33 13-33 13-15 31-15-31-33-13 33-13 15-31Z"/>
    <path d="M1084 304l10 20 22 8-22 9-10 20-10-20-22-9 22-8 10-20Z"/>
  </g>
</svg>
